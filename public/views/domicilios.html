<!-- ============================================
     VISTA: domicilios.html
     Descripción: Interfaz para gestionar domicilios
     ============================================ -->
<link rel="stylesheet" href="/css/estilos.css">

<!-- Header -->
<div class="gp-page-header container mt-4">
  <h2 class="gp-page-title">Gestión de Domicilios</h2>
  <div class="gp-header-actions">
    <button class="gp-btn-crear" onclick="mostrarFormulario()">+ Crear Domicilio</button>
    <button class="gp-btn-cancelar d-none" id="btnCancelar" onclick="mostrarTabla()">✕ Cancelar</button>
  </div>
</div>

<!-- FORMULARIO -->
<div class="container d-none gp-form-card" id="contenedorFormulario">
  <form id="formDomicilios">

    <input type="hidden" id="pk_domicilio">

    <div class="gp-form-grid">

      <div class="mb-3">
        <label class="gp-label">Calle</label>
        <input type="text" id="nombre" class="gp-input" required placeholder="Ej: Av. México">
      </div>

      <div class="mb-3">
        <label class="gp-label">Número</label>
        <input type="text" id="num" class="gp-input" required placeholder="Ej: 123">
      </div>

    </div>

    <button type="submit" class="gp-btn-submit">Guardar Domicilio</button>
  </form>
</div>

<!-- TABLA -->
<div class="container mt-4" id="contenedorTabla">

  <div class="gp-table-header">
    <span class="gp-table-subtitle">Lista de domicilios registrados</span>
  </div>

  <div class="gp-card">
    <div class="table-responsive">
      <table class="table gp-table mb-0">
        <thead>
          <tr>
            <th style="width:60px">#</th>
            <th>Calle</th>
            <th>Número</th>
            <th>Fecha Registro</th>
            <th>Estado</th>
            <th style="width:150px">Acciones</th>
          </tr>
        </thead>

        <!-- ⚠️ ID original intacto -->
        <tbody id="tablaDomicilios"></tbody>
      </table>
    </div>

    <div class="gp-footer-paginacion" id="footer-paginacion"></div>
  </div>

</div>
