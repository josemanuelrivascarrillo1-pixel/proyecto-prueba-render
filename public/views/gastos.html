<div class="alert alert-primary mt-4 container text-center">
    <h2>Gestión de Gastos</h2>
</div>

<!-- Botones -->
<div class="container mb-3 text-end">
    <button class="btn btn-success" onclick="mostrarFormulario()">Crear Gasto</button>
    <button class="btn btn-secondary d-none" id="btnCancelar" onclick="mostrarTabla()">Cancelar</button>
</div>

<!-- FORMULARIO -->
<div class="container d-none" id="contenedorFormulario">
    <form id="formGasto">

        <input type="hidden" id="pk_gasto">

        <div class="mb-3">
            <label class="form-label">Nombre del gasto</label>
            <input type="text" id="nombre" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Monto</label>
            <input type="number" id="monto" class="form-control" step="0.01" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Descuento (%)</label>
            <input type="number" id="descuento" class="form-control" step="0.01" placeholder="Opcional">
        </div>

        <div class="mb-3">
            <label class="form-label">Fecha</label>
            <input type="date" id="fecha" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Categoría</label>
            <select id="fk_categoria" class="form-control">
                <option value="">Seleccionar categoría</option>
                <!-- Aquí puedes cargar categorías dinámicamente -->
            </select>
        </div>

        <button type="submit" class="btn btn-success w-100">Guardar Gasto</button>
    </form>
</div>

<!-- TABLA -->
<div class="container mt-4" id="contenedorTabla">
    <table class="table table-striped">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Monto</th>
                <th>Descuento</th>
                <th>Total</th>
                <th>Fecha</th>
                <th>Categoría</th>
                <th>Acciones</th>
            </tr>
            <link rel="stylesheet" href="../css/estilos.css">
        </thead>
        <tbody id="tablaGastos"></tbody>
    </table>

    <div id="footer-paginacion"></div>
</div>
